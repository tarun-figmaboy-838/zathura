<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Driftbound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lilita+One&family=Orbitron:wght@700;900&display=swap" />
  <link rel="stylesheet" href="src/style.css" />
  <script>
    // If start-up fails, say why on the title screen instead of spinning forever.
    (function () {
      // only real failures count: a script error, or a game script that did not load
      function fail(msg) {
        if (window.game) return;
        var m = document.getElementById('load-msg'), b = document.getElementById('start');
        if (b) b.classList.add('failed');
        if (m && !m.textContent) m.textContent = msg;
      }
      addEventListener('error', function (e) {
        var el = e.target;
        if (e.message) fail('Could not start (' + e.message + '). Reload with Cmd+Shift+R.');
        else if (el && el.tagName === 'SCRIPT') fail('The game files did not load. Start it with start.command.');
      }, true);
      addEventListener('unhandledrejection', function (e) {
        if (!window.game) fail('Could not start (' + ((e.reason && e.reason.message) || e.reason) + '). Reload with Cmd+Shift+R.');
      });
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ============================== in-game HUD -->
  <div id="hud" class="hidden">
    <div id="markers"></div>
    <div id="turret-marker"></div>
    <div id="crosshair"><span class="ring"></span><span class="dot"></span>
      <svg id="hitmarker" viewBox="-20 -20 40 40" aria-hidden="true">
        <line x1="-13" y1="-13" x2="-6" y2="-6" /><line x1="13" y1="-13" x2="6" y2="-6" />
        <line x1="-13" y1="13" x2="-6" y2="6" /><line x1="13" y1="13" x2="6" y2="6" />
      </svg>
    </div>

    <div id="top-left">
      <div class="level"><b id="level-num">SECTOR 1/5</b><span id="level-name">Drift Lanes</span></div>
      <div class="objective" id="objective"></div>
      <div class="vitals">
        <div class="vital shield"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z" /></svg><i><em id="shield-bar"></em></i></div>
        <div class="vital hull"><svg viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z" /></svg><i><em id="hull-bar"></em></i></div>
      </div>
    </div>

    <div id="bossbar" class="hidden">
      <div class="row"><b>Warden</b><span id="boss-state"></span></div>
      <div class="bar"><i id="boss-fill"></i></div>
    </div>

    <div id="top-right">
      <div class="score"><span>Score</span><b id="score">0</b></div>
      <button id="pause-btn" class="img-btn" aria-label="Pause"><img src="assets/ui/btn-pause.png" alt="" draggable="false" /></button>
    </div>

    <div id="banner"><div class="title"></div><div class="sub"></div></div>
    <div id="alert"></div>
  </div>

  <!-- ============================== on-screen controls -->
  <div id="controls" class="hidden" data-mode="chase">
    <div class="pad">
      <button class="dir left" data-hold="left" aria-label="Steer left"><img src="assets/ui/btn-arrow.png" alt="" draggable="false" /></button>
      <button class="dir right" data-hold="right" aria-label="Steer right"><img src="assets/ui/btn-arrow.png" alt="" draggable="false" /></button>
    </div>
    <div class="actions">
      <button class="act shield" data-tap="shield" aria-label="Shield (Q)">
        <img src="assets/ui/btn-shield.png" alt="" draggable="false" /><span class="cd"></span><kbd>Q</kbd>
      </button>
      <button class="act lock" data-tap="lock" aria-label="Lock on (E)">
        <img src="assets/ui/btn-lock.png" alt="" draggable="false" /><span class="cd"></span><kbd>E</kbd>
      </button>
      <button class="act fire" data-hold="fire" aria-label="Fire (Space)">
        <span class="heat"></span><img src="assets/ui/btn-fire.png" alt="" draggable="false" /><kbd>Space</kbd>
      </button>
    </div>
  </div>

  <!-- ============================== angle battle: question, hint and answer options -->
  <div id="quiz" class="hidden">
    <div class="quiz-prompt" id="quiz-prompt"><span class="text" id="quiz-text"></span></div>
    <div class="quiz-options">
      <button class="opt" type="button"><img src="assets/ui/opt.png" alt="" draggable="false" /><span></span></button>
      <button class="opt" type="button"><img src="assets/ui/opt.png" alt="" draggable="false" /><span></span></button>
      <button class="opt" type="button"><img src="assets/ui/opt.png" alt="" draggable="false" /><span></span></button>
      <button class="opt" type="button"><img src="assets/ui/opt.png" alt="" draggable="false" /><span></span></button>
    </div>
  </div>

  <button id="skip" class="img-btn hidden" type="button" aria-label="Skip intro"><img src="assets/ui/btn-skip.png" alt="" draggable="false" /></button>

  <!-- ============================== title -->
  <div id="title" class="screen">
    <h1 class="title-logo"><img src="assets/ui/title.png" alt="Driftbound" draggable="false" /></h1>
    <div class="play">
      <button id="start" class="play-btn" aria-label="Play" disabled>
        <span class="ping"></span><img src="assets/ui/btn-play.png" alt="" draggable="false" />
      </button>
      <p id="load-msg"></p>
    </div>
  </div>

  <!-- ============================== pause / game over / victory -->
  <div id="pause" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Paused">
    <div class="panel small">
      <h2>Paused</h2>
      <div class="modal-actions">
        <button id="resume" class="img-btn big" aria-label="Resume"><img src="assets/ui/btn-play.png" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <div id="gameover" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Ship destroyed">
    <div class="panel small">
      <h2>Destroyed</h2>
      <div class="results">
        <div><span>Score</span><b id="go-score">0</b></div>
        <div><span>Sector</span><b id="go-level">1</b></div>
      </div>
      <div class="modal-actions">
        <button id="restart" class="img-btn" aria-label="Restart from the station"><img src="assets/ui/btn-home.png" alt="" draggable="false" /></button>
        <button id="retry" class="img-btn big" aria-label="Retry sector"><img src="assets/ui/btn-retry.png" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <div id="victory" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Journey complete">
    <div class="panel small">
      <h2>Victory</h2>
      <div class="results">
        <div><span>Score</span><b id="v-score">0</b></div>
        <div><span>Best</span><b id="v-best">0</b></div>
      </div>
      <div class="new-best hidden" id="v-newbest">New best</div>
      <div class="modal-actions">
        <button id="again" class="img-btn big" aria-label="Fly again"><img src="assets/ui/btn-retry.png" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <div id="whiteout"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
