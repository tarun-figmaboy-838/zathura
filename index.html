<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Driftbound</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="assets/ui/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/ui/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Lilita+One&family=Orbitron:wght@700;900&display=swap" />
  <link rel="stylesheet" href="src/style.css" />
  <script>
    // If start-up fails, say why on the title screen instead of spinning forever.
    (function () {
      // only real failures count: a script error, or a game script that did not load
      function fail(msg) {
        if (window.game) return;
        var m = document.getElementById('load-msg'), b = document.getElementById('start');
        if (b) b.classList.add('failed');
        if (m && !m.textContent) m.textContent = msg;
      }
      addEventListener('error', function (e) {
        var el = e.target;
        if (e.message) fail('Could not start (' + e.message + '). Reload with Cmd+Shift+R.');
        else if (el && el.tagName === 'SCRIPT') fail('The game files did not load. Start it with start.command.');
      }, true);
      addEventListener('unhandledrejection', function (e) {
        if (!window.game) fail('Could not start (' + ((e.reason && e.reason.message) || e.reason) + '). Reload with Cmd+Shift+R.');
      });
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ============================== in-game HUD -->
  <div id="hud" class="hidden">
    <div id="markers"></div>
    <div id="turret-marker"></div>
    <div id="crosshair"><span class="ring"></span><span class="dot"></span>
      <svg id="hitmarker" viewBox="-20 -20 40 40" aria-hidden="true">
        <line x1="-13" y1="-13" x2="-6" y2="-6" /><line x1="13" y1="-13" x2="6" y2="-6" />
        <line x1="-13" y1="13" x2="-6" y2="6" /><line x1="13" y1="13" x2="6" y2="6" />
      </svg>
    </div>

    <div id="bossbar" class="hidden">
      <div class="row"><b>Warden</b><span id="boss-state"></span></div>
      <div class="bar"><i id="boss-fill"></i></div>
    </div>

    <div id="top-right">
      <div class="score" aria-label="Score"><i class="coin" aria-hidden="true"></i><b id="score">0</b></div>
      <button id="pause-btn" class="img-btn" aria-label="Pause"><img src="assets/ui/btn-pause.webp" alt="" draggable="false" /></button>
    </div>

    <div id="banner"><div class="title"></div><div class="sub"></div></div>
    <div id="alert"></div>
  </div>

  <!-- ============================== on-screen controls -->
  <div id="controls" class="hidden" data-mode="chase">
    <!-- one joystick: steers while flying, turns the cannon (sets x) in the angle battles -->
    <div class="stick" id="stick" role="slider" aria-label="Joystick"><i class="stick-knob"></i></div>
    <div class="actions">
      <button class="act shield" data-tap="shield" aria-label="Shield (Q)">
        <img src="assets/ui/btn-shield.webp" alt="" draggable="false" /><span class="cd"></span><kbd>Q</kbd>
      </button>
      <button class="act lock" data-tap="lock" aria-label="Lock on (E)">
        <img src="assets/ui/btn-lock.webp" alt="" draggable="false" /><span class="cd"></span><kbd>E</kbd>
      </button>
      <button class="act fire" data-hold="fire" aria-label="Fire (Space)">
        <span class="heat"></span><img src="assets/ui/btn-fire.webp" alt="" draggable="false" /><kbd>Space</kbd>
      </button>
    </div>
  </div>

  <!-- ============================== introductions: one short line at a time (tap to skip ahead) -->
  <div id="narrate" class="narrate" role="status" aria-live="polite"><span class="text"></span></div>

  <!-- ============================== angle battle: question, hint and answer options -->
  <div id="quiz" class="hidden">
    <div class="quiz-prompt" id="quiz-prompt">
      <span class="text" id="quiz-text"></span>
    </div>
  </div>

  <button id="skip" class="img-btn hidden" type="button" aria-label="Skip intro"><img src="assets/ui/btn-skip.webp" alt="" draggable="false" /></button>

  <!-- ============================== title -->
  <!-- the bridge, seen from the captain's seat: the live 3D view shows through the windshield -->
  <div id="cockpit" aria-hidden="true">
    <div class="cockpit-frame"><img src="assets/ui/cockpit.webp" alt="" draggable="false" /></div>
  </div>

  <div id="title" class="screen">
    <div class="cockpit-frame">
      <h1 class="title-logo"><img src="assets/ui/title.webp" alt="Driftbound" draggable="false" /></h1>
      <button id="start" class="play-btn" aria-label="Play" disabled>
        <span class="ping"></span><img src="assets/ui/btn-play.webp" alt="" draggable="false" />
      </button>
      <p id="load-msg"></p>
    </div>
  </div>

  <!-- ============================== pause / game over / victory -->
  <div id="pause" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Paused">
    <div class="panel small">
      <h2>Paused</h2>
      <div class="modal-actions">
        <button id="p-sound" class="round-btn" type="button" aria-label="Sound on or off">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round" /></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke-width="2" stroke-linecap="round" /></svg>
        </button>
        <button id="resume" class="img-btn big" aria-label="Resume"><img src="assets/ui/btn-play.webp" alt="" draggable="false" /></button>
        <button id="p-home" class="img-btn" aria-label="Restart from the station"><img src="assets/ui/btn-home.webp" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <div id="gameover" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Ship destroyed">
    <div class="panel small">
      <h2 id="go-title">Destroyed</h2>
      <div class="results">
        <div><span>Score</span><b id="go-score">0</b></div>
        <div><span>Level</span><b id="go-level">L1</b></div>
      </div>
      <div class="modal-actions">
        <button id="restart" class="img-btn" aria-label="Restart from the station"><img src="assets/ui/btn-home.webp" alt="" draggable="false" /></button>
        <button id="retry" class="img-btn big" aria-label="Retry sector"><img src="assets/ui/btn-retry.webp" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <div id="victory" class="screen modal hidden" role="dialog" aria-modal="true" aria-label="Journey complete">
    <div class="panel small victory">
      <h2>Victory</h2>
      <div class="stars big" id="v-stars"><i></i><i></i><i></i></div>
      <div class="v-score"><b id="v-score">0</b><span id="v-best">Best 0</span></div>
      <div class="modal-actions">
        <button id="again" class="img-btn big" aria-label="Fly again"><img src="assets/ui/btn-retry.webp" alt="" draggable="false" /></button>
      </div>
    </div>
  </div>

  <!-- ============================== comms dialogue: portrait, nameplate, the line typing out -->
  <div id="dialog" class="dialog" data-face="crew" role="status" aria-live="polite">
    <div class="portrait"><img src="assets/ui/face-crew.webp" alt="" draggable="false" /></div>
    <div class="talk"><b class="name"></b><p class="line"></p></div>
    <i class="more" aria-hidden="true"></i>
    <svg class="tail" viewBox="0 -3 32 30" aria-hidden="true"><path class="ink" d="M1,0 L16,26.5 L31,0 Z" /><path class="fill" d="M6.6,-3 L16,15.5 L25.4,-3 Z" /><path class="rim" d="M6,-1 L16,18 L26,-1" /></svg>
  </div>

  <!-- ============================== every 4 levels: just the stars earned, then the game flies on -->
  <div id="report" class="stars-pop" aria-hidden="true"><div class="stars" id="r-stars"><i></i><i></i><i></i></div></div>

  <div id="whiteout"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
